<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>القسطاس الجنائي AI - قانون العقوبات الجزائري</title>
  <meta name="theme-color" content="#0f172a">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --gold: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }
    header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      padding: 12px 14px;
      border-bottom: 2px solid var(--gold);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .logo h1 { font-size: 1rem; color: var(--gold); font-weight: 800; }
    .logo p { font-size: 0.7rem; color: var(--muted); }
    .official-links { display: flex; gap: 5px; align-items: center; }
    .joradp-btn {
      font-size: 0.7rem;
      padding: 5px 8px;
      border-radius: 10px;
      background: rgba(245, 158, 11, 0.15);
      color: var(--gold);
      border: 1px solid var(--gold);
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
    }
    .key-bar {
      background: #1e293b;
      padding: 10px 14px;
      border-bottom: 1px solid #334155;
      display: none;
      gap: 6px;
    }
    .key-bar.open { display: flex; }
    .key-input {
      flex: 1;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--gold);
      background: #0f172a;
      color: #fff;
      font-size: 0.85rem;
      direction: ltr;
    }
    .container {
      max-width: 750px;
      width: 100%;
      margin: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }
    .quick-prompts {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }
    .quick-prompts::-webkit-scrollbar { display: none; }
    .prompt-chip {
      background: var(--card);
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      white-space: nowrap;
      cursor: pointer;
    }
    .prompt-chip:hover { border-color: var(--gold); color: var(--gold); }
    .chat-area {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      flex: 1;
      overflow-y: auto;
      margin-bottom: 10px;
      border: 1px solid #334155;
    }
    .msg {
      padding: 12px 15px;
      border-radius: 14px;
      margin-bottom: 12px;
      font-size: 0.92rem;
      line-height: 1.75;
      word-wrap: break-word;
    }
    .msg.bot {
      background: #0f172a;
      border-right: 3px solid var(--gold);
      color: #f1f5f9;
    }
    .msg.bot b, .msg.bot strong { color: var(--gold); }
    .msg.user {
      background: var(--gold);
      color: #000;
      font-weight: 700;
      margin-right: 18%;
    }
    .ai-input-group {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .ai-input {
      flex: 1;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: var(--card);
      color: var(--text);
      font-size: 0.95rem;
    }
    .ai-input:focus { outline: none; border-color: var(--gold); }
    .send-btn {
      padding: 0 20px;
      border-radius: 12px;
      border: none;
      background: var(--gold);
      color: #000;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <h1>⚖️ القسطاس الجنائي AI</h1>
    <p>مدعوم بمحرك Gemini • قانون العقوبات الجزائري</p>
  </div>
  <div class="official-links">
    <button type="button" class="joradp-btn" onclick="toggleKeyBar()">🔑 المفتاح</button>
    <a href="https://www.joradp.dz/HAR/Index.htm" target="_blank" class="joradp-btn">📜 الجريدة</a>
    <a href="https://droit.mjustice.gov.dz/ar" target="_blank" class="joradp-btn">🏛️ العدل</a>
  </div>
</header>

<div class="key-bar" id="keyBar">
  <input type="text" id="geminiKeyInput" class="key-input" placeholder="الصق مفتاح Gemini API Key هنا...">
  <button type="button" class="send-btn" style="padding:0 14px;font-size:0.82rem;" onclick="saveKey()">حفظ</button>
</div>

<div class="container">
  <div class="quick-prompts">
    <button type="button" class="prompt-chip" onclick="usePrompt('ما هي عقوبة السرقة الموصوفة في قانون العقوبات الجزائري؟')">عقوبة السرقة الموصوفة</button>
    <button type="button" class="prompt-chip" onclick="usePrompt('اشرح أحكام المادة 264 من قانون العقوبات الجزائري')">المادة 264 (الضرب والجرح)</button>
    <button type="button" class="prompt-chip" onclick="usePrompt('ما هي شروط الدفاع المشروع في قانون العقوبات الجزائري؟')">الدفاع المشروع</button>
    <button type="button" class="prompt-chip" onclick="usePrompt('ما هي عقوبة إصدار شيك بدون رصيد في القانون الجزائري؟')">شيك بدون رصيد</button>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="msg bot">
      مرحباً بك في <b>القسطاس الجنائي AI</b> المدعوم مباشرة بمحرك <b>Google Gemini</b>.<br>
      اسأل عن أي مادة أو جريمة في قانون العقوبات الجزائري وسأجيبك بدقة ومباشرة.
    </div>
  </div>

  <div class="ai-input-group">
    <input type="text" id="userQuestion" class="ai-input" placeholder="اسأل عن مادة، جريمة، أو عقوبة...">
    <button type="button" id="sendBtn" class="send-btn" onclick="askGemini()">إرسال</button>
  </div>
</div>

<script>
