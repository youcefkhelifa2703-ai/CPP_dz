<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قانون الإجراءات الجزائية الجزائري AI</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --gold: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --green: #10b981;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 80px; }
    header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      padding: 18px 16px;
      border-bottom: 2px solid var(--gold);
      position: sticky; top: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
    }
    .logo h1 { font-size: 1.1rem; color: var(--gold); font-weight: 800; }
    .logo p { font-size: 0.75rem; color: var(--muted); }
    .status-badge {
      font-size: 0.72rem; padding: 4px 10px; border-radius: 20px;
      background: rgba(16, 185, 129, 0.15); color: var(--green);
      border: 1px solid var(--green); font-weight: 700;
    }
    .status-badge.offline {
      background: rgba(239, 68, 68, 0.15); color: var(--red); border-color: var(--red);
    }
    .container { max-width: 700px; margin: auto; padding: 16px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn {
      flex: 1; padding: 12px; border: none; border-radius: 12px;
      background: var(--card); color: var(--muted); font-weight: 700;
      font-size: 0.9rem; cursor: pointer; transition: 0.2s;
    }
    .tab-btn.active { background: var(--gold); color: #000; }
    .search-box {
      width: 100%; padding: 14px; border-radius: 12px;
      border: 1px solid #334155; background: var(--card);
      color: var(--text); font-size: 0.95rem; margin-bottom: 14px;
    }
    .search-box:focus { outline: none; border-color: var(--gold); }
    .law-card {
      background: var(--card); border-radius: 14px; padding: 16px;
      margin-bottom: 12px; border-right: 4px solid var(--gold);
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    .law-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .art-num { color: var(--gold); font-weight: 800; font-size: 1rem; }
    .art-cat { font-size: 0.75rem; background: #334155; padding: 2px 8px; border-radius: 6px; }
    .art-title { font-weight: 700; margin-bottom: 6px; font-size: 0.95rem; color: #e2e8f0; }
    .art-text { font-size: 0.9rem; line-height: 1.7; color: #cbd5e1; }
    
    .ai-box { display: none; }
    .ai-box.active { display: block; }
    .laws-box.hidden { display: none; }
    .chat-area {
      background: var(--card); border-radius: 14px; padding: 14px;
      min-height: 300px; max-height: 420px; overflow-y: auto;
      margin-bottom: 12px; border: 1px solid #334155;
    }
    .msg { padding: 10px 14px; border-radius: 12px; margin-bottom: 10px; font-size: 0.9rem; line-height: 1.6; }
    .msg.bot { background: #0f172a; border-right: 3px solid var(--gold); }
    .msg.user { background: var(--gold); color: #000; font-weight: 600; margin-right: 20%; }
    .ai-input-group { display: flex; gap: 8px; }
    .ai-input {
      flex: 1; padding: 12px; border-radius: 12px; border: 1px solid #334155;
      background: var(--card); color: var(--text); font-size: 0.9rem;
    }
    .send-btn {
      padding: 0 18px; border-radius: 12px; border: none;
      background: var(--gold); color: #000; font-weight: 800; cursor: pointer;
    }
    .update-banner {
      background: #065f46; color: #ecfdf5; padding: 10px; border-radius: 10px;
      font-size: 0.82rem; margin-bottom: 12px; display: none; text-align: center;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <h1>⚖️ الإجراءات الجزائية DZ</h1>
    <p id="versionInfo">جاري التحقق من التحديثات...</p>
  </div>
  <div id="netStatus" class="status-badge">متصل • محدث</div>
</header>

<div class="container">
  <div id="updateBanner" class="update-banner"></div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('laws')">📚 المواد القانونية (بدون نت)</button>
    <button class="tab-btn" onclick="switchTab('ai')">🤖 المستشار الذكي AI</button>
  </div>

  <div id="lawsSection" class="laws-box">
    <input type="text" id="searchInput" class="search-box" placeholder="ابحث برقم المادة أو الكلمة (مثال: توقيف، تلبس، تفتيش...)" onkeyup="filterLaws()">
    <div id="lawsList"></div>
  </div>

  <div id="aiSection" class="ai-box">
    <div class="chat-area" id="chatArea">
      <div class="msg bot">
        مرحباً بك. أنا مساعدك القانوني المتخصص <b>حصرياً في قانون الإجراءات الجزائية الجزائري</b>. اسألني عن أي إجراء، أجل قانوني، أو مادة وسأجيبك بدقة وفق آخر التعديلات.
      </div>
    </div>

    <div class="ai-input-group">
      <input type="text" id="userQuestion" class="ai-input" placeholder="اكتب سؤالك القانوني هنا...">
      <button class="send-btn" onclick="askAI()">إرسال</button>
    </div>
  </div>
</div>

<script>
  let allLaws = [];

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    if (tab === 'laws') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('lawsSection').classList.remove('hidden');
      document.getElementById('aiSection').classList.remove('active');
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('lawsSection').classList.add('hidden');
      document.getElementById('aiSection').classList.add('active');
    }
  }

  function updateOnlineStatus() {
    const badge = document.getElementById('netStatus');
    if (navigator.onLine) {
      badge.textContent = 'متصل • محدث تلقائياً';
      badge.classList.remove('offline');
      checkUpdates();
    } else {
      badge.textContent = 'وضع بدون إنترنت (Offline)';
      badge.classList.add('offline');
    }
  }
  window.addEventListener('online', updateOnlineStatus);
  window.addEventListener('offline', updateOnlineStatus);

  async function loadLaws() {
    try {
      const res = await fetch('./laws.json?t=' + Date.now());
      allLaws = await res.json();
      localStorage.setItem('cached_laws', JSON.stringify(allLaws));
    } catch (e) {
      const cached = localStorage.getItem('cached_laws');
      if (cached) allLaws = JSON.parse(cached);
    }
    renderLaws(allLaws);
  }

  async function checkUpdates() {
    try {
      const res = await fetch('./version.json?t=' + Date.now());
      const data = await res.json();
      const oldVer = localStorage.getItem('app_version');
      document.getElementById('versionInfo').textContent = `الإصدار ${data.version} • تحيين ${data.updated_at}`;
      
      if (oldVer && oldVer !== data.version) {
        const banner = document.getElementById('updateBanner');
        banner.style.display = 'block';
        banner.textContent = `✅ تم تحديث القوانين تلقائياً إلى الإصدار ${data.version}`;
        await loadLaws();
      }
      localStorage.setItem('app_version', data.version);
    } catch (e) {
      const savedVer = localStorage.getItem('app_version') || '1.0';
      document.getElementById('versionInfo').textContent = `نسخة محفوظة (${savedVer}) • تعمل بدون نت`;
    }
  }

  function renderLaws(list) {
    const container = document.getElementById('lawsList');
    if (!list.length) {
      container.innerHTML = '<p style="text-align:center;color:#94a3b8;">لا توجد نتائج مطابقة.</p>';
      return;
    }
    container.innerHTML = list.map(item => `
      <div class="law-card">
        <div class="law-header">
          <span class="art-num">${item.article}</span>
          <span class="art-cat">${item.category}</span>
        </div>
        <div class="art-title">${item.title}</div>
        <div class="art-text">${item.text}</div>
      </div>
    `).join('');
  }

  function filterLaws() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allLaws.filter(l =>
      l.article.toLowerCase().includes(q) ||
      l.title.toLowerCase().includes(q) ||
      l.text.toLowerCase().includes(q) ||
      (l.keywords && l.keywords.toLowerCase().includes(q))
    );
    renderLaws(filtered);
  }

  async function askAI() {
    if (!navigator.onLine) {
      alert('أنت حالياً بدون إنترنت. استخدم تبويب "المواد القانونية" للبحث الفوري بدون نت.');
      return;
    }

    const input = document.getElementById('userQuestion');
    const question = input.value.trim();
    if (!question) return;

    const chatArea = document.getElementById('chatArea');
    chatArea.innerHTML += `<div class="msg user">${question}</div>`;
    input.value = '';
    const loadingId = 'load_' + Date.now();
    chatArea.innerHTML += `<div class="msg bot" id="${loadingId}">⏳ جاري تحليل النصوص القانونية...</div>`;
    chatArea.scrollTop = chatArea.scrollHeight;

    try {
      const response = await fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          question: question,
          lawsContext: JSON.stringify(allLaws)
        })
      });
      const data = await response.json();
      const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'حدث خطأ في الاتصال، تأكد من إضافة ملف api/ask.js ومفتاح GEMINI_API_KEY في Vercel.';
      document.getElementById(loadingId).innerHTML = reply.replace(/\n/g, '<br>');
    } catch (err) {
      document.getElementById(loadingId).textContent = 'تعذر الاتصال بالخادم، تحقق من الإنترنت.';
    }
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }

  loadLaws();
  updateOnlineStatus();
</script>
</body>
</html>
