<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>القسطاس الجنائي AI - قانون العقوبات الجزائري</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --gold: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }
    header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      padding: 12px 16px;
      border-bottom: 2px solid var(--gold);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .logo h1 { font-size: 1.05rem; color: var(--gold); font-weight: 800; }
    .logo p { font-size: 0.72rem; color: var(--muted); }
    .official-links { display: flex; gap: 6px; }
    .joradp-btn {
      font-size: 0.72rem;
      padding: 5px 10px;
      border-radius: 10px;
      background: rgba(245, 158, 11, 0.15);
      color: var(--gold);
      border: 1px solid var(--gold);
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }
    .container {
      max-width: 750px;
      width: 100%;
      margin: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }
    .quick-prompts {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }
    .quick-prompts::-webkit-scrollbar { display: none; }
    .prompt-chip {
      background: var(--card);
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      white-space: nowrap;
      cursor: pointer;
    }
    .prompt-chip:hover { border-color: var(--gold); color: var(--gold); }
    .chat-area {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      flex: 1;
      overflow-y: auto;
      margin-bottom: 10px;
      border: 1px solid #334155;
    }
    .msg {
      padding: 12px 15px;
      border-radius: 14px;
      margin-bottom: 12px;
      font-size: 0.92rem;
      line-height: 1.75;
      word-wrap: break-word;
    }
    .msg.bot {
      background: #0f172a;
      border-right: 3px solid var(--gold);
      color: #f1f5f9;
    }
    .msg.bot b, .msg.bot strong { color: var(--gold); }
    .msg.user {
      background: var(--gold);
      color: #000;
      font-weight: 700;
      margin-right: 18%;
    }
    .ai-input-group {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .ai-input {
      flex: 1;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: var(--card);
      color: var(--text);
      font-size: 0.95rem;
    }
    .ai-input:focus { outline: none; border-color: var(--gold); }
    .send-btn {
      padding: 0 20px;
      border-radius: 12px;
      border: none;
      background: var(--gold);
      color: #000;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <h1>⚖️ القسطاس الجنائي AI</h1>
    <p>قانون العقوبات الجزائري • مباشر وبدون قيود</p>
  </div>
  <div class="official-links">
    <a href="https://www.joradp.dz/TRV/APenal.pdf" target="_blank" class="joradp-btn">📜 النص الرسمي</a>
    <a href="https://droit.mjustice.gov.dz/ar" target="_blank" class="joradp-btn">🏛️ وزارة العدل</a>
  </div>
</header>

<div class="container">
  <div class="quick-prompts">
    <button type="button" class="prompt-chip" onclick="usePrompt('ما هي عقوبة السرقة الموصوفة في قانون العقوبات الجزائري؟')">عقوبة السرقة الموصوفة</button>
    <button type="button" class="prompt-chip" onclick="usePrompt('اشرح لي أحكام المادة 264 من قانون العقوبات الجزائري')">المادة 264 (الضرب والجرح)</button>
    <button type="button" class="prompt-chip" onclick="usePrompt('ما هي شروط الدفاع المشروع في قانون العقوبات الجزائري؟')">الدفاع المشروع</button>
    <button type="button" class="prompt-chip" onclick="usePrompt('ما هي عقوبة إصدار شيك بدون رصيد؟')">شيك بدون رصيد</button>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="msg bot">
      مرحباً بك في <b>القسطاس الجنائي AI</b>، مستشارك الذكي المتخصص <b>حصرياً في قانون العقوبات الجزائري</b>.<br>
      اطرح سؤالك أو اكتب رقم المادة القانونية، وسيقوم الذكاء الاصطناعي بتحليلها فوراً.
    </div>
  </div>

  <div class="ai-input-group">
    <input type="text" id="userQuestion" class="ai-input" placeholder="اسأل عن مادة، جريمة، أو عقوبة...">
    <button type="button" id="sendBtn" class="send-btn" onclick="askAI()">إرسال</button>
  </div>
</div>

<script>
  // إلغاء أي Service Worker قديم يمنع التحديث الفوري
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      for (let reg of regs) reg.unregister();
    });
  }

  const SYSTEM_INSTRUCTION = `أنت مستشار قانوني جزائري خبير ومتخصص حصرياً في قانون العقوبات الجزائري (الأمر رقم 66-156 المعدل والمتمم). أجب فوراً وبشكل مباشر في نقاط واضحة باللغة العربية الفصحى حول مضمون المادة أو الجريمة وأركانها والعقوبات المقررة بالدينار الجزائري والحبس/السجن، أو حالة إلغائها إن كانت ملغاة. إذا كان السؤال خارج القانون الجنائي الجزائري اعتذر بلباقة.`;

  document.getElementById('userQuestion').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      askAI();
    }
  });

  function usePrompt(text) {
    document.getElementById('userQuestion').value = text;
    askAI();
  }

  function escapeHTML(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function formatMarkdown(text) {
    return escapeHTML(text)
      .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
      .replace(/\n/g, '<br>');
  }

  async function fetchWithTimeout(url, options, timeout = 14000) {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), timeout);
    try {
      const response = await fetch(url, { ...options, signal: controller.signal });
      clearTimeout(id);
      return response;
    } catch (err) {
      clearTimeout(id);
      throw err;
    }
  }

  async function askAI() {
    const input = document.getElementById('userQuestion');
    const sendBtn = document.getElementById('sendBtn');
    const question = input.value.trim();
    if (!question) return;

    const chatArea = document.getElementById('chatArea');
    chatArea.innerHTML += `<div class="msg user">${escapeHTML(question)}</div>`;
    input.value = '';
    sendBtn.disabled = true;
    sendBtn.textContent = '...';

    const loadingId = 'load_' + Date.now();
    chatArea.innerHTML += `<div class="msg bot" id="${loadingId}">⏳ جاري استخراج الحكم القانوني...</div>`;
    chatArea.scrollTop = chatArea.scrollHeight;

    let replyText = '';

    try {
      // المحاولة 1: مسار GET السريع والمباشر
      const promptQuery = encodeURIComponent(`${SYSTEM_INSTRUCTION}\n\nالسؤال في قانون العقوبات الجزائري: ${question}`);
      const res1 = await fetchWithTimeout(`https://text.pollinations.ai/${promptQuery}?model=openai&seed=${Date.now()}`, { method: 'GET' }, 14000);
      if (res1.ok) {
        replyText = await res1.text();
      }
    } catch (e1) {
      // المحاولة 2: مسار POST الاحتياطي
      try {
        const res2 = await fetchWithTimeout('https://text.pollinations.ai/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: [
              { role: 'system', content: SYSTEM_INSTRUCTION },
              { role: 'user', content: question }
            ],
            model: 'mistral'
          })
        }, 14000);
        if (res2.ok) {
          replyText = await res2.text();
        }
      } catch (e2) {
        replyText = '';
      }
    }

    if (replyText && replyText.trim().length > 5) {
      document.getElementById(loadingId).innerHTML = formatMarkdown(replyText);
    } else {
      document.getElementById(loadingId).innerHTML = '⚠️ الخادم مزدحم حالياً، اضغط <b>إرسال</b> مرة أخرى أو تصفح <a href="https://www.joradp.dz/TRV/APenal.pdf" target="_blank" style="color:#f59e0b;">النص الرسمي المدمج</a>.';
    }

    sendBtn.disabled = false;
    sendBtn.textContent = 'إرسال';
    chatArea.scrollTop = chatArea.scrollHeight;
  }
</script>
</body>
</html>
