<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>القسطاس الجنائي AI - قانون العقوبات الجزائري</title>
  <meta name="theme-color" content="#0f172a">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://js.puter.com/v2/"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --gold: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }
    header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      padding: 12px 16px;
      border-bottom: 2px solid var(--gold);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .logo h1 { font-size: 1.05rem; color: var(--gold); font-weight: 800; }
    .logo p { font-size: 0.72rem; color: var(--muted); }
    .official-links { display: flex; gap: 6px; }
    .joradp-btn {
      font-size: 0.72rem;
      padding: 5px 10px;
      border-radius: 10px;
      background: rgba(245, 158, 11, 0.15);
      color: var(--gold);
      border: 1px solid var(--gold);
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }
    .container {
      max-width: 750px;
      width: 100%;
      margin: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }
    .quick-prompts {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }
    .quick-prompts::-webkit-scrollbar { display: none; }
    .prompt-chip {
      background: var(--card);
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      white-space: nowrap;
      cursor: pointer;
    }
    .prompt-chip:hover { border-color: var(--gold); color: var(--gold); }
    .chat-area {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      flex: 1;
      overflow-y: auto;
      margin-bottom: 10px;
      border: 1px solid #334155;
    }
    .msg {
      padding: 12px 15px;
      border-radius: 14px;
      margin-bottom: 12px;
      font-size: 0.92rem;
      line-height: 1.75;
      word-wrap: break-word;
    }
    .msg.bot {
      background: #0f172a;
      border-right: 3px solid var(--gold);
      color: #f1f5f9;
    }
    .msg.bot b, .msg.bot strong { color: var(--gold); }
    .msg.user {
      background: var(--gold);
      color: #000;
      font-weight: 700;
      margin-right: 18%;
    }
    .ai-input-group {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .ai-input {
      flex: 1;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: var(--card);
      color: var(--text);
      font-size: 0.95rem;
    }
    .ai-input:focus { outline: none; border-color: var(--gold); }
    .send-btn {
      padding: 0 20px;
      border-radius: 12px;
      border: none;
      background: var(--gold);
      color: #000;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
    }
  </style>
</head>

    <a href="https://droit.mjustice.gov.dz/ar" target="_blank" class="joradp-btn">🏛️ وزارة العدل</a>
  </div>
</header>
