<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المستشار الذكي - قانون العقوبات الجزائري AI</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --gold: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --green: #10b981;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }
    header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      padding: 14px 16px;
      border-bottom: 2px solid var(--gold);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .logo h1 { font-size: 1.05rem; color: var(--gold); font-weight: 800; }
    .logo p { font-size: 0.74rem; color: var(--muted); }
    .status-badge {
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--green);
      border: 1px solid var(--green);
      font-weight: 700;
    }
    .status-badge.offline {
      background: rgba(239, 68, 68, 0.15);
      color: var(--red);
      border-color: var(--red);
    }
    .container {
      max-width: 750px;
      width: 100%;
      margin: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }
    .quick-prompts {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }
    .quick-prompts::-webkit-scrollbar { display: none; }
    .prompt-chip {
      background: var(--card);
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      white-space: nowrap;
      cursor: pointer;
      transition: 0.2s;
    }
    .prompt-chip:hover { border-color: var(--gold); color: var(--gold); }
    .chat-area {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      flex: 1;
      overflow-y: auto;
      margin-bottom: 10px;
      border: 1px solid #334155;
    }
    .msg {
      padding: 12px 15px;
      border-radius: 14px;
      margin-bottom: 12px;
      font-size: 0.92rem;
      line-height: 1.75;
      word-wrap: break-word;
    }
    .msg.bot {
      background: #0f172a;
      border-right: 3px solid var(--gold);
      color: #f1f5f9;
    }
    .msg.bot b, .msg.bot strong { color: var(--gold); }
    .msg.user {
      background: var(--gold);
      color: #000;
      font-weight: 700;
      margin-right: 18%;
    }
    .ai-input-group {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .ai-input {
      flex: 1;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: var(--card);
      color: var(--text);
      font-size: 0.95rem;
    }
    .ai-input:focus { outline: none; border-color: var(--gold); }
    .send-btn {
      padding: 0 20px;
      border-radius: 12px;
      border: none;
      background: var(--gold);
      color: #000;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <h1>⚖️ قانون العقوبات الجزائري AI</h1>
    <p>مُحيّن تلقائياً وفق الجريدة الرسمية</p>
  </div>
  <div id="netStatus" class="status-badge">متصل بالشبكة</div>
</header>

<div class="container">
  <div class="quick-prompts">
    <button class="prompt-chip" onclick="usePrompt('ما هي عقوبة السرقة الموصوفة في قانون العقوبات الجزائري؟')">عقوبة السرقة الموصوفة</button>
    <button class="prompt-chip" onclick="usePrompt('اشرح لي أحكام المادة 264 من قانون العقوبات الجزائري')">المادة 264 (الضرب والجرح)</button>
    <button class="prompt-chip" onclick="usePrompt('ما هي شروط الدفاع المشروع في قانون العقوبات الجزائري؟')">الدفاع المشروع</button>
    <button class="prompt-chip" onclick="usePrompt('ما هي عقوبة إصدار شيك بدون رصيد؟')">شيك بدون رصيد</button>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="msg bot">
      مرحباً بك. أنا مستشارك القانوني الذكي المتخصص <b>حصرياً في قانون العقوبات الجزائري</b> ومرتبط بالبحث المباشر في آخر التعديلات التشريعية.<br>
      اطرح سؤالك أو اكتب رقم المادة القانونية وسأوافيك بالنص والعقوبة بدقة.
    </div>
  </div>

  <div class="ai-input-group">
    <input type="text" id="userQuestion" class="ai-input" placeholder="اسأل عن مادة، جريمة، أو عقوبة..." onkeypress="if(event.key==='Enter') askAI()">
    <button class="send-btn" onclick="askAI()">إرسال</button>
  </div>
</div>

<script>
  function updateOnlineStatus() {
    const badge = document.getElementById('netStatus');
    if (navigator.onLine) {
      badge.textContent = 'متصل • محدث تلقائياً';
      badge.classList.remove('offline');
    } else {
      badge.textContent = 'غير متصل بالإنترنت';
      badge.classList.add('offline');
    }
  }
  window.addEventListener('online', updateOnlineStatus);
  window.addEventListener('offline', updateOnlineStatus);

  function usePrompt(text) {
    document.getElementById('userQuestion').value = text;
    askAI();
  }

  function formatMarkdown(text) {
    return text
      .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
      .replace(/\n/g, '<br>');
  }

  async function askAI() {
    if (!navigator.onLine) {
      alert('يرجى الاتصال بالإنترنت للبحث في النصوص القانونية المحدثة.');
      return;
    }

    const input = document.getElementById('userQuestion');
    const question = input.value.trim();
    if (!question) return;

    const chatArea = document.getElementById('chatArea');
    chatArea.innerHTML += `<div class="msg user">${question}</div>`;
    input.value = '';
    const loadingId = 'load_' + Date.now();
    chatArea.innerHTML += `<div class="msg bot" id="${loadingId}">⏳ جاري البحث في نصوص قانون العقوبات الجزائري وتحليلها...</div>`;
    chatArea.scrollTop = chatArea.scrollHeight;

    try {
      const response = await fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question })
      });
      const data = await response.json();
      const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'تعذر الحصول على إجابة، حاول مرة أخرى.';
      document.getElementById(loadingId).innerHTML = formatMarkdown(reply);
    } catch (err) {
      document.getElementById(loadingId).textContent = 'حدث خطأ في الاتصال بالخادم، تحقق من الإنترنت.';
    }
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  // إلغاء تسجيل Service Worker القديم لإزالة التخزين المؤقت القديم
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      for (let reg of regs) reg.unregister();
    });
  }

  updateOnlineStatus();
</script>
</body>
</html>
